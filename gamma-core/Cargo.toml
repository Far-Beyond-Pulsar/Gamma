[package]
name = "gamma-core"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Core runtime for the Gamma event system — Event trait, EventBus, and FFI-safe dispatch"

[dependencies]
rustc-hash = "2"
rayon = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[features]
default = []
parallel = ["dep:rayon"]
serde = ["dep:serde"]

[dev-dependencies]
gamma-derive = { path = "../gamma-derive" }
criterion = { version = "0.5", features = ["html_reports"] }
libloading = "0.8"

[[bench]]
name = "throughput"
harness = false
